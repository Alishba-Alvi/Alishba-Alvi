<svg viewBox="0 0 580 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pillGradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5c8a"/>
      <stop offset="100%" stop-color="#ff2e9a"/>
    </linearGradient>
    <linearGradient id="pillGradB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9db3"/>
      <stop offset="100%" stop-color="#e0483f"/>
    </linearGradient>
    <linearGradient id="pillGradC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffcf6b"/>
      <stop offset="100%" stop-color="#ff9d3f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g font-size="13" font-weight="bold">

    <!-- Row 1 -->
    <g transform="translate(10,10)">
      <rect width="170" height="50" rx="25" fill="#1c0f28" stroke="url(#pillGradA)" stroke-width="2.2" filter="url(#glow)">
        <animate attributeName="stroke-width" values="2.2;3.2;2.2" dur="3s" repeatCount="indefinite"/>
      </rect>
      <circle cx="25" cy="25" r="17" fill="url(#pillGradA)"/>
      <image href="https://cdn.simpleicons.org/react/ffffff" x="15" y="15" width="20" height="20"/>
      <text x="52" y="30" fill="#ffe9f0" text-anchor="start">React</text>
    </g>

    <g transform="translate(200,10)">
      <rect width="170" height="50" rx="25" fill="#1c0f28" stroke="url(#pillGradB)" stroke-width="2.2" filter="url(#glow)">
        <animate attributeName="stroke-width" values="3.2;2.2;3.2" dur="3.4s" repeatCount="indefinite"/>
      </rect>
      <circle cx="25" cy="25" r="17" fill="url(#pillGradB)"/>
      <image href="https://cdn.simpleicons.org/typescript/ffffff" x="15" y="15" width="20" height="20"/>
      <text x="52" y="30" fill="#ffe9f0" text-anchor="start">TypeScript</text>
    </g>

    <g transform="translate(390,10)">
      <rect width="170" height="50" rx="25" fill="#1c0f28" stroke="url(#pillGradC)" stroke-width="2.2" filter="url(#glow)">
        <animate attributeName="stroke-width" values="2.2;3.2;2.2" dur="2.7s" repeatCount="indefinite"/>
      </rect>
      <circle cx="25" cy="25" r="17" fill="url(#pillGradC)"/>
      <image href="https://cdn.simpleicons.org/javascript/ffffff" x="15" y="15" width="20" height="20"/>
      <text x="52" y="30" fill="#ffe9f0" text-anchor="start">JavaScript</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(10,80)">
      <rect width="170" height="50" rx="25" fill="#1c0f28" stroke="url(#pillGradC)" stroke-width="2.2" filter="url(#glow)">
        <animate attributeName="stroke-width" values="3.2;2.2;3.2" dur="3.1s" repeatCount="indefinite"/>
      </rect>
      <circle cx="25" cy="25" r="17" fill="url(#pillGradC)"/>
      <image href="https://cdn.simpleicons.org/html5/ffffff" x="15" y="15" width="20" height="20"/>
      <text x="52" y="30" fill="#ffe9f0" text-anchor="start">HTML5</text>
    </g>

    <g transform="translate(200,80)">
      <rect width="170" height="50" rx="25" fill="#1c0f28" stroke="url(#pillGradA)" stroke-width="2.2" filter="url(#glow)">
        <animate attributeName="stroke-width" values="2.2;3.2;2.2" dur="2.9s" repeatCount="indefinite"/>
      </rect>
      <circle cx="25" cy="25" r="17" fill="url(#pillGradA)"/>
      <image href="https://cdn.simpleicons.org/css3/ffffff" x="15" y="15" width="20" height="20"/>
      <text x="52" y="30" fill="#ffe9f0" text-anchor="start">CSS3</text>
    </g>

    <g transform="translate(390,80)">
      <rect width="170" height="50" rx="25" fill="#1c0f28" stroke="url(#pillGradB)" stroke-width="2.2" filter="url(#glow)">
        <animate attributeName="stroke-width" values="3.2;2.2;3.2" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <circle cx="25" cy="25" r="17" fill="url(#pillGradB)"/>
      <image href="https://cdn.simpleicons.org/redux/ffffff" x="15" y="15" width="20" height="20"/>
      <text x="52" y="30" fill="#ffe9f0" text-anchor="start">Redux</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(10,150)">
      <rect width="170" height="50" rx="25" fill="#1c0f28" stroke="url(#pillGradB)" stroke-width="2.2" filter="url(#glow)">
        <animate attributeName="stroke-width" values="2.2;3.2;2.2" dur="3.3s" repeatCount="indefinite"/>
      </rect>
      <circle cx="25" cy="25" r="17" fill="url(#pillGradB)"/>
      <image href="https://cdn.simpleicons.org/nestjs/ffffff" x="15" y="15" width="20" height="20"/>
      <text x="52" y="30" fill="#ffe9f0" text-anchor="start">NestJS</text>
    </g>

    <g transform="translate(200,150)">
      <rect width="170" height="50" rx="25" fill="#1c0f28" stroke="url(#pillGradA)" stroke-width="2.2" filter="url(#glow)">
        <animate attributeName="stroke-width" values="3.2;2.2;3.2" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <circle cx="25" cy="25" r="17" fill="url(#pillGradA)"/>
      <image href="https://cdn.simpleicons.org/postgresql/ffffff" x="15" y="15" width="20" height="20"/>
      <text x="52" y="30" fill="#ffe9f0" text-anchor="start">PostgreSQL</text>
    </g>

    <g transform="translate(390,150)">
      <rect width="170" height="50" rx="25" fill="#1c0f28" stroke="url(#pillGradC)" stroke-width="2.2" filter="url(#glow)">
        <animate attributeName="stroke-width" values="2.2;3.2;2.2" dur="3.8s" repeatCount="indefinite"/>
      </rect>
      <circle cx="25" cy="25" r="17" fill="url(#pillGradC)"/>
      <image href="https://cdn.simpleicons.org/typeorm/ffffff" x="15" y="15" width="20" height="20"/>
      <text x="52" y="30" fill="#ffe9f0" text-anchor="start">TypeORM</text>
    </g>

  </g>
</svg>
