<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="footSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#170821"/>
      <stop offset="55%" stop-color="#2d1240"/>
      <stop offset="100%" stop-color="#5a1f4a"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#ff5c8a" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ff5c8a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff5c8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff4d6"/>
      <stop offset="60%" stop-color="#ffcf6b"/>
      <stop offset="100%" stop-color="#ff9f5c"/>
    </radialGradient>
    <linearGradient id="mtnBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1848"/>
      <stop offset="100%" stop-color="#2a1035"/>
    </linearGradient>
    <linearGradient id="mtnFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5c8a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1240"/>
    </linearGradient>
    <linearGradient id="groundFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0512" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0c0512" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcf6b"/>
      <stop offset="100%" stop-color="#ff8fb3"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="footType">
      <rect x="0" y="0" width="0" height="150">
        <animate attributeName="width" values="0;1200;1200;0;0" keyTimes="0;0.3;0.75;0.95;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="150" fill="url(#footSky)"/>
  <rect width="1200" height="150" fill="url(#horizonGlow)"/>

  <circle cx="80" cy="28" r="1.4" fill="#ffe9a8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="18" r="1" fill="#ffe9a8"><animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="1100" cy="24" r="1.5" fill="#ffe9a8"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="1040" cy="45" r="1" fill="#ffe9a8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="960" cy="20" r="1.3" fill="#ffe9a8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="480" cy="16" r="1.2" fill="#ffe9a8"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="640" cy="30" r="1" fill="#ffe9a8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></circle>

  <line x1="150" y1="10" x2="110" y2="0" stroke="url(#textGrad)" stroke-width="2" stroke-linecap="round" opacity="0">
    <animate id="shoot" attributeName="x1" values="150;330" dur="1.1s" begin="1s;shoot.end+5s" fill="freeze"/>
    <animate attributeName="x2" values="110;300" dur="1.1s" begin="1s;shoot.end+5s" fill="freeze"/>
    <animate attributeName="y1" values="10;70" dur="1.1s" begin="1s;shoot.end+5s" fill="freeze"/>
    <animate attributeName="y2" values="0;55" dur="1.1s" begin="1s;shoot.end+5s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;1" dur="1.1s" begin="1s;shoot.end+5s" fill="freeze"/>
  </line>

  <circle cx="1000" cy="40" r="26" fill="url(#moonGrad)" filter="url(#softGlow)" opacity="0.5"/>
  <circle cx="1000" cy="40" r="22" fill="url(#moonGrad)"/>

  <polygon points="0,120 70,60 150,120" fill="url(#mtnBack)"/>
  <polygon points="110,120 190,45 270,120" fill="url(#mtnBack)"/>
  <polygon points="900,120 970,55 1050,120" fill="url(#mtnBack)"/>
  <polygon points="1000,120 1080,40 1170,120" fill="url(#mtnBack)"/>

  <polygon points="40,120 130,50 220,120" fill="url(#mtnFront)"/>
  <polygon points="960,120 1050,50 1140,120" fill="url(#mtnFront)"/>

  <rect x="0" y="105" width="1200" height="45" fill="url(#groundFade)"/>

  <g clip-path="url(#footType)">
    <text x="600" y="82" font-size="30" font-weight="bold" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2" filter="url(#glow)">SEE YOU IN THE NEXT COMMIT.</text>
  </g>
</svg>
