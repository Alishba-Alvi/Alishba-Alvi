<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="footSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#170821"/>
      <stop offset="100%" stop-color="#3a1240"/>
    </linearGradient>
    <clipPath id="footType">
      <rect x="0" y="0" width="0" height="150">
        <animate attributeName="width" values="0;1200;1200;0;0" keyTimes="0;0.3;0.75;0.95;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="150" fill="url(#footSky)"/>

  <circle cx="80" cy="30" r="1.5" fill="#ffe9a8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="1100" cy="24" r="1.5" fill="#ffe9a8"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="960" cy="45" r="1.3" fill="#ffe9a8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>

  <polygon points="0,120 60,70 120,120" fill="#3a1848"/>
  <polygon points="90,120 160,55 230,120" fill="#4a2258"/>
  <polygon points="200,120 260,80 320,120" fill="#3a1848"/>
  <polygon points="880,120 940,80 1000,120" fill="#3a1848"/>
  <polygon points="970,120 1040,55 1110,120" fill="#4a2258"/>
  <polygon points="1080,120 1140,70 1200,120" fill="#3a1848"/>

  <rect x="0" y="120" width="1200" height="30" fill="#0c0512"/>

  <g clip-path="url(#footType)">
    <text x="600" y="80" font-size="30" font-weight="bold" fill="#ffcf6b" text-anchor="middle" letter-spacing="2">SEE YOU IN THE NEXT COMMIT.</text>
  </g>
</svg>
