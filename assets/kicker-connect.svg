<svg viewBox="0 0 1200 46" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CONNECT" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shimmerFade4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9B2F5E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C23E75" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9B2F5E" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes fadeIn4 { from { opacity: 0; } to { opacity: 1; } }
