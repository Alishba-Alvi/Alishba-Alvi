  <path class="spark4" d="M 18 12 L 21 18 L 27 20 L 21 22 L 18 28 L 15 22 L 9 20 L 15 18 Z" fill="#C23E75"/>
  <text class="txt4" x="42" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" letter-spacing="3.5" fill="#9B2F5E">CONNECT</text>
  <rect x="0" y="40" width="1200" height="1.5" fill="#EEE3E7"/>
  <rect class="shimmer4" x="0" y="40" width="150" height="1.5" fill="url(#shimmerFade4)"/>
