<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    circle { animation: pulse 2.6s ease-in-out infinite; transform-origin: 10px 10px; }
  </style>
  <circle cx="10" cy="10" r="3" fill="#C23E75"/>
</svg>
