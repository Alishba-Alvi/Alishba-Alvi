<svg viewBox="0 0 400 6" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shimmerFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9B2F5E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E8A0B4" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#9B2F5E" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes sweep {
        0% { transform: translateX(-140px); }
        100% { transform: translateX(400px); }
      }
      .shimmer { animation: sweep 4.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect x="0" y="2.25" width="400" height="1.5" fill="#3A2530"/>
  <rect class="shimmer" x="0" y="0" width="140" height="6" fill="url(#shimmerFade)"/>
</svg>
