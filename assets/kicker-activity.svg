<svg viewBox="0 0 1200 46" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GITHUB ACTIVITY" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shimmerFade2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9B2F5E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C23E75" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9B2F5E" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes fadeIn2 { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pulseSpark2 { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
      @keyframes sweep2 { 0% { transform: translateX(-140px); } 100% { transform: translateX(1200px); } }
      .txt2 { opacity: 0; animation: fadeIn2 0.6s ease-out 0.05s forwards; }
      .spark2 { transform-origin: 18px 20px; animation: pulseSpark2 2.6s ease-in-out infinite; }
      .shimmer2 { animation: sweep2 5s ease-in-out infinite; }
    </style>
  </defs>
  <path class="spark2" d="M 18 12 L 21 18 L 27 20 L 21 22 L 18 28 L 15 22 L 9 20 L 15 18 Z" fill="#C23E75"/>
  <text class="txt2" x="42" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" letter-spacing="3.5" fill="#9B2F5E">GITHUB ACTIVITY</text>
  <rect x="0" y="40" width="1200" height="1.5" fill="#EEE3E7"/>
  <rect class="shimmer2" x="0" y="40" width="150" height="1.5" fill="url(#shimmerFade2)"/>
</svg>
