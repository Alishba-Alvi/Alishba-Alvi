<svg width="700" height="40" viewBox="0 0 700 40" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="lineGradLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5c8a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffcf6b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="lineGradRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcf6b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff5c8a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4d6"/>
      <stop offset="45%" stop-color="#ffcf6b"/>
      <stop offset="100%" stop-color="#ff8fb3"/>
    </radialGradient>
    <filter id="dividerGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <line x1="20" y1="20" x2="322" y2="20" stroke="url(#lineGradLeft)" stroke-width="1"/>
  <line x1="378" y1="20" x2="680" y2="20" stroke="url(#lineGradRight)" stroke-width="1"/>

  <circle cx="60" cy="20" r="1.2" fill="#ffcf6b" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="20" r="1.2" fill="#ffcf6b" opacity="0.6">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(350,20)">
    <circle r="8" fill="url(#sparkleGrad)" filter="url(#dividerGlow)" opacity="0.55"/>
    <path d="M0,-9 C0.8,-3 3,-0.8 9,0 C3,0.8 0.8,3 0,9 C-0.8,3 -3,0.8 -9,0 C-3,-0.8 -0.8,-3 0,-9 Z" fill="url(#sparkleGrad)">
      <animateTransform attributeName="transform" type="scale" values="1;1.18;1" dur="2.4s" repeatCount="indefinite" additive="sum"/>
    </path>
    <circle r="1.4" fill="#fff4d6"/>
  </g>
</svg>
