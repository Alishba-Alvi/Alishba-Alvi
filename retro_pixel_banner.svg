<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <!-- Glow filter for neon text -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur3"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for subtitle -->
    <filter id="subtleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Star glow -->
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pixel font style using rectangles pattern -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF69B4">
        <animate attributeName="stop-color" values="#FF69B4;#00F7FF;#FF69B4;#DA70D6;#FF69B4" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00F7FF">
        <animate attributeName="stop-color" values="#00F7FF;#FF69B4;#DA70D6;#00F7FF;#00F7FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#DA70D6">
        <animate attributeName="stop-color" values="#DA70D6;#DA70D6;#00F7FF;#FF69B4;#DA70D6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="subtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF">
        <animate attributeName="stop-color" values="#00F7FF;#88EEFF;#00F7FF" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#88EEFF">
        <animate attributeName="stop-color" values="#88EEFF;#00F7FF;#88EEFF" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0a0a2e"/>
    </linearGradient>

    <!-- Scanline pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(255,255,255,0.015)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Animated grid lines (subtle) -->
  <g opacity="0.04">
    <line x1="0" y1="80" x2="900" y2="80" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="900" y2="160" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="225" y1="0" x2="225" y2="320" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="320" stroke="#00F7FF" stroke-width="0.5"/>
    <line x1="675" y1="0" x2="675" y2="320" stroke="#00F7FF" stroke-width="0.5"/>
  </g>

  <!-- Scanlines overlay -->
  <rect width="900" height="320" fill="url(#scanlines)" rx="12"/>

  <!-- ═══ TWINKLING STARS / PIXEL DOTS ═══ -->

  <!-- Star cluster 1 - top left -->
  <circle cx="72" cy="45" r="2" fill="#FF69B4" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="145" cy="28" r="1.5" fill="#00F7FF" filter="url(#starGlow)">
    <animate attributeName="opacity" values="1;0.1;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="58" cy="92" r="1.5" fill="#DA70D6" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="60" r="1" fill="#FFD700" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Star cluster 2 - top right -->
  <circle cx="780" cy="38" r="2" fill="#00F7FF" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="72" r="1.5" fill="#FF69B4" filter="url(#starGlow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="55" r="1" fill="#FFD700" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="855" cy="110" r="1.5" fill="#DA70D6" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/>
  </circle>

  <!-- Star cluster 3 - bottom area -->
  <circle cx="90" cy="260" r="1.5" fill="#00F7FF" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="810" cy="250" r="2" fill="#FF69B4" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="280" r="1" fill="#FFD700" filter="url(#starGlow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="285" r="1.5" fill="#DA70D6" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="40" r="1" fill="#00F7FF" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="35" r="1.5" fill="#FF69B4" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="290" r="1" fill="#DA70D6" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="280" r="1.5" fill="#00F7FF" filter="url(#starGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="75" r="1" fill="#FFD700" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="68" r="1" fill="#FF69B4" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══ FLOATING PIXEL BLOCKS (animated) ═══ -->

  <!-- Left pixel block -->
  <rect x="40" y="140" width="8" height="8" rx="1" fill="#FF69B4" opacity="0.6">
    <animate attributeName="y" values="140;130;140" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="55" y="155" width="6" height="6" rx="1" fill="#00F7FF" opacity="0.5">
    <animate attributeName="y" values="155;165;155" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="30" y="175" width="5" height="5" rx="1" fill="#DA70D6" opacity="0.4">
    <animate attributeName="y" values="175;168;175" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Right pixel block -->
  <rect x="845" y="145" width="8" height="8" rx="1" fill="#00F7FF" opacity="0.6">
    <animate attributeName="y" values="145;155;145" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="830" y="165" width="6" height="6" rx="1" fill="#FF69B4" opacity="0.5">
    <animate attributeName="y" values="165;155;165" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="855" y="185" width="5" height="5" rx="1" fill="#FFD700" opacity="0.4">
    <animate attributeName="y" values="185;178;185" dur="5.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5.2s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══ DECORATIVE BRACKETS ═══ -->
  <text x="110" y="160" font-family="'Courier New', monospace" font-size="60" fill="#FF69B4" opacity="0.15" font-weight="bold">{</text>
  <text x="750" y="160" font-family="'Courier New', monospace" font-size="60" fill="#00F7FF" opacity="0.15" font-weight="bold">}</text>

  <!-- ═══ MAIN TITLE — ALISHBA ALVI ═══ -->
  <text x="450" y="135" text-anchor="middle" font-family="'Courier New', 'Consolas', monospace" font-size="62" font-weight="bold" fill="url(#textGradient)" filter="url(#neonGlow)" letter-spacing="8">
    ALISHBA ALVI
    <animate attributeName="filter" values="url(#neonGlow);url(#subtleGlow);url(#neonGlow)" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Underline accent -->
  <rect x="230" y="155" width="440" height="2" rx="1" fill="url(#textGradient)" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="width" values="430;450;430" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x" values="235;225;235" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══ SUBTITLE ═══ -->
  <text x="450" y="195" text-anchor="middle" font-family="'Courier New', 'Consolas', monospace" font-size="20" fill="url(#subtitleGrad)" filter="url(#subtleGlow)" letter-spacing="6">
    FULL-STACK DEVELOPER
  </text>

  <!-- ═══ TECH LINE ═══ -->
  <text x="450" y="235" text-anchor="middle" font-family="'Courier New', 'Consolas', monospace" font-size="12" fill="#888888" letter-spacing="3" opacity="0.8">
    React  •  Redux  •  TypeScript  •  NestJS  •  TypeORM  •  PostgreSQL
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- ═══ BOTTOM CURSOR BLINK ═══ -->
  <text x="450" y="275" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#00F7FF">
    &gt; ready to build_
  </text>
  <rect x="545" y="262" width="10" height="16" fill="#00F7FF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══ CORNER ACCENTS ═══ -->
  <!-- Top-left corner -->
  <polyline points="12,35 12,12 35,12" fill="none" stroke="#FF69B4" stroke-width="2" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </polyline>
  <!-- Top-right corner -->
  <polyline points="865,12 888,12 888,35" fill="none" stroke="#00F7FF" stroke-width="2" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
  </polyline>
  <!-- Bottom-left corner -->
  <polyline points="12,285 12,308 35,308" fill="none" stroke="#00F7FF" stroke-width="2" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
  </polyline>
  <!-- Bottom-right corner -->
  <polyline points="865,308 888,308 888,285" fill="none" stroke="#FF69B4" stroke-width="2" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </polyline>
</svg>
