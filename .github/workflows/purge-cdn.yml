name: Update Banner Cache

on:
  push:
    branches:
      - main
    paths:
      - 'assets/banner.svg'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Purge jsDelivr cache
        run: curl -s "https://purge.jsdelivr.net/gh/Alishba-Alvi/Alishba-Alvi@main/assets/banner.svg"

      - name: Bump README cache-buster
        run: |
          SHA=$(git rev-parse --short HEAD)
          sed -i -E "s#(banner\.svg)(\?v=[a-zA-Z0-9]+)?\"#\1?v=${SHA}\"#" README.md

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: bust banner cache [skip ci]"
          git push
