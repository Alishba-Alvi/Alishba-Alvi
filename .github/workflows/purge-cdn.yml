name: Purge jsDelivr Cache

on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr cache for all assets
        run: |
          for file in banner.svg badge-linkedin.svg badge-email.svg letstalk-header.svg; do
            echo "Purging $file..."
            curl -s "https://purge.jsdelivr.net/gh/Alishba-Alvi/Alishba-Alvi@main/assets/$file"
            echo ""
          done
