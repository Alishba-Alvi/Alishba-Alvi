name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Alishba-Alvi
          outputs: |
            dist/github-snake.svg?color_snake=%23ff5c8a&color_dots=170821,3a1848,c9184a,e0483f,ffcf6b
            dist/github-snake-dark.svg?color_snake=%23ff5c8a&color_dots=170821,3a1848,c9184a,e0483f,ffcf6b

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
